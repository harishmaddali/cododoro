name: Publish Release

# Builds, signs and publishes the desktop installers for a given tag.
#
# Triggered three ways:
#   • automatically by the Release workflow (workflow_call) after it bumps
#     the version and pushes a tag on a push to main
#   • by pushing a v* tag manually
#   • manually from the Actions tab (workflow_dispatch) to rebuild a tag

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v0.2.0)'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.2.0)'
        required: true
        type: string

jobs:
  publish-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
            rust-targets: ''
          - platform: 'windows-latest'
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Compute changelog
        id: changelog
        shell: bash
        run: |
          PREV=$(git describe --tags --abbrev=0 "${{ steps.tag.outputs.tag }}^" 2>/dev/null || echo '')
          if [ -z "$PREV" ]; then
            COMMITS=$(git log --pretty=format:'- %s (%h)' --no-merges)
          else
            COMMITS=$(git log "$PREV..${{ steps.tag.outputs.tag }}" --pretty=format:'- %s (%h)' --no-merges)
          fi
          if [ -z "$COMMITS" ]; then
            COMMITS="- No releasable commits"
          fi
          {
            echo "commits<<EOF"
            echo "$COMMITS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets && format('{0},wasm32-unknown-unknown', matrix.rust-targets) || 'wasm32-unknown-unknown' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/desktop-app/src-tauri -> target'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and sign the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PASSWORD }}
        with:
          projectPath: apps/desktop-app
          tagName: ${{ steps.tag.outputs.tag }}
          releaseName: 'cododoro ${{ steps.tag.outputs.tag }}'
          releaseBody: |
            ## What's changed
            ${{ steps.changelog.outputs.commits }}

            ## Release artifacts
            - macOS (Intel + Apple Silicon universal binary): `.dmg`
            - Windows: `.msi` and `.exe` installers
            - Linux: `.AppImage` and `.deb`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
