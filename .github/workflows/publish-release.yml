name: Publish Release

# Builds, signs and publishes the desktop installers for a given tag.
#
# Triggered three ways:
#   • automatically by the Release workflow (workflow_call) after it bumps
#     the version and pushes a tag on a push to main
#   • by pushing a v* tag manually
#   • manually from the Actions tab (workflow_dispatch) to rebuild a tag

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v0.2.0)'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.2.0)'
        required: true
        type: string

jobs:
  publish-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build and sign the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PASSWORD }}
        with:
          tagName: ${{ steps.tag.outputs.tag }}
          releaseName: 'cododoro ${{ steps.tag.outputs.tag }}'
          releaseBody: |
            See the assets to download this version and install.

            Release artifacts:
            - macOS: Universal binary (Intel + Apple Silicon) `.dmg`
            - Windows: MSI installer
            - Linux: AppImage
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
